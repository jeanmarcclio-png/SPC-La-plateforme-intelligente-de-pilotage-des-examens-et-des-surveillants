name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spc-cockpit

jobs:
  quality:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spc-cockpit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  # Les tests end-to-end ne tournaient PAS en intégration continue. Conséquence
  # constatée : un test verrouillait le comportement fautif du sélecteur de
  # statuts (BUG-011) et est resté rouge plusieurs commits sans que personne le
  # voie. Ils sont désormais exécutés à chaque pull request.
  e2e:
    name: Tests end-to-end (navigateur)
    runs-on: ubuntu-latest
    env:
      # Valeurs FACTICES, jamais déployées : le build inline les variables
      # publiques, et le client Supabase du navigateur refuse de s'initialiser
      # sans elles. Les tests s'exécutent sous SPC_DEMO=1 et n'atteignent
      # aucune base — voir spc-cockpit/tests/RECETTE-SUPABASE.md pour ce qui
      # nécessite une vraie instance.
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anon-factice-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spc-cockpit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: spc-cockpit/playwright-report/
          retention-days: 7
